<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Opening… — Kernel's Source</title>
<style>
:root{--bg:#fff;--text:#1f2023;--muted:#6b6d76;--red:#e11d2e;--line:#ececee;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#141316;--text:#f3f2f4;--muted:#a2a1aa;--red:#ff3b4d;--line:#2a292e}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:16px/1.6 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
.c{max-width:360px;width:100%}
h1{font-size:22px;margin:0 0 8px}
p{color:var(--muted);font-size:14px;margin:0 0 20px}
.b{display:block;padding:14px 18px;border-radius:14px;font-weight:700;text-decoration:none;margin-bottom:10px;border:1px solid var(--line);color:var(--text);background:none;width:100%;font-size:15px;font-family:inherit;cursor:pointer}
.b.p{background:var(--red);border-color:var(--red);color:#fff}
code{display:block;font:12px ui-monospace,monospace;color:var(--muted);word-break:break-all;margin-top:14px}
</style>
</head>
<body>
<div class="c">
  <h1 id="t">Opening your installer…</h1>
  <p id="d">If nothing happens, tap the button.</p>
  <a class="b p" id="go" href="#">Open</a>
  <button class="b" id="cp" type="button">Copy source link</button>
  <code id="u"></code>
</div>
<script>
const ALLOWED = ["altstore:", "sidestore:", "feather:", "scarlet:"];
const NAMES = { "altstore:":"AltStore", "sidestore:":"SideStore", "feather:":"Feather", "scarlet:":"Scarlet" };
const raw = new URLSearchParams(location.search).get("u") || "";
let proto = "";
try { proto = new URL(raw).protocol; } catch (e) {}
const go = document.getElementById("go");
if (!ALLOWED.includes(proto)) {
  document.getElementById("t").textContent = "Invalid link";
  document.getElementById("d").textContent = "This page only opens AltStore, SideStore, Feather and Scarlet links.";
  go.href = "/"; go.textContent = "Back to the source";
  document.getElementById("cp").remove();
} else {
  const name = NAMES[proto];
  go.href = raw; go.textContent = "Open in " + name;
  document.getElementById("t").textContent = "Opening " + name + "…";
  document.getElementById("u").textContent = raw;
  document.getElementById("cp").onclick = async function () {
    let src = raw;
    try { src = decodeURIComponent((raw.match(/url=([^&]+)/) || [])[1] || raw.replace(/^feather:\/\/source\//, "")); } catch (e) {}
    try { await navigator.clipboard.writeText(src); this.textContent = "Copied"; } catch (e) { this.textContent = "Copy it from the text below"; }
  };
  setTimeout(() => { location.href = raw; }, 150);
}
</script>
</body>
</html>
