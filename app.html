<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App — Kernel's Source</title>

<style>
@font-face{font-family:Inter;font-weight:400;font-style:normal;font-display:swap;src:url(assets/fonts/inter-400.woff) format("woff")}
@font-face{font-family:Inter;font-weight:500;font-style:normal;font-display:swap;src:url(assets/fonts/inter-500.woff) format("woff")}
@font-face{font-family:Inter;font-weight:600;font-style:normal;font-display:swap;src:url(assets/fonts/inter-600.woff) format("woff")}
@font-face{font-family:Inter;font-weight:700;font-style:normal;font-display:swap;src:url(assets/fonts/inter-700.woff) format("woff")}
@font-face{font-family:Inter;font-weight:800;font-style:normal;font-display:swap;src:url(assets/fonts/inter-800.woff) format("woff")}
:root{
  --bg:#ffffff; --surface:#ffffff; --tint:#fff4f5; --line:#ececee; --line-strong:#e0e0e4;
  --text:#1f2023; --muted:#6b6d76; --red:#e11d2e; --red-dark:#bf1523; --red-soft:#ffe3e6;
  --shadow:0 1px 2px rgba(31,32,35,.04),0 8px 24px -12px rgba(31,32,35,.12);
  --ring:rgba(225,29,46,.35); color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141316; --surface:#1b1a1e; --tint:#241719; --line:#2a292e; --line-strong:#38363d;
    --text:#f3f2f4; --muted:#a2a1aa; --red:#ff3b4d; --red-dark:#ff6b79; --red-soft:#3a1a1e;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141316; --surface:#1b1a1e; --tint:#241719; --line:#2a292e; --line-strong:#38363d;
  --text:#f3f2f4; --muted:#a2a1aa; --red:#ff3b4d; --red-dark:#ff6b79; --red-soft:#3a1a1e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:72px;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:8px}
.wrap{max-width:1040px;margin:0 auto;padding:0 max(24px,env(safe-area-inset-left,0px)) 0 max(24px,env(safe-area-inset-right,0px))}
.hidden{display:none!important}

/* modal */
.modal-overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.modal-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px 24px 24px;max-width:400px;width:100%;max-height:100%;overflow-y:auto;text-align:center;box-shadow:var(--shadow)}
.modal-card h2{font-size:22px;margin:0 0 8px}
.modal-card p{font-size:14px;color:var(--muted);margin:0 0 20px}
.modal-x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:10px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer}
.modal-x:hover{background:var(--tint);color:var(--text)}
.client-opt-btn{width:100%;padding:12px 16px;border-radius:14px;font:600 15px Inter,sans-serif;border:1px solid var(--line);background:var(--tint);color:var(--text);cursor:pointer;margin-bottom:10px;display:flex;align-items:center;transition:border-color .15s,background .15s}
.client-opt-btn:hover{border-color:var(--red);background:var(--red-soft)}
.client-opt-btn.sel{border-color:var(--red)}
.client-opt-btn .ci{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--red);color:#fff;font-weight:800;font-size:14px;position:relative}
.client-opt-btn .ci img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.client-opt-btn .ci svg{width:18px;height:18px}
.client-opt-btn span.t{flex:1;text-align:left;margin-left:12px}

/* nav */
nav{position:sticky;top:0;z-index:10;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.logo{width:30px;height:30px;border-radius:9px;background:var(--red);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;overflow:hidden;position:relative}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nav-r{display:flex;align-items:center;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent;background:none;cursor:pointer}
.icon-btn:hover{color:var(--text);border-color:var(--line);background:var(--tint)}
.nav-link{font-size:14px;color:var(--muted);padding:8px 12px;border-radius:10px}
.nav-link:hover{color:var(--text);background:var(--tint)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2}
.theme-ic{overflow:visible}
.theme-ic .core{transform-origin:12px 12px;transform:scale(1);transition:transform .6s cubic-bezier(.4,0,.2,1)}
.theme-ic .cut{transform:translate(16px,-16px);transition:transform .6s cubic-bezier(.4,0,.2,1)}
.theme-ic .rays{transform-origin:12px 12px;transition:transform .6s cubic-bezier(.4,0,.2,1),opacity .4s}
:root[data-theme="light"] .theme-ic .core{transform:scale(1.55)}
:root[data-theme="light"] .theme-ic .cut{transform:translate(0,0)}
:root[data-theme="light"] .theme-ic .rays{transform:rotate(-90deg) scale(.4);opacity:0}
:root[data-theme="dark"] .theme-ic .rays{transform:rotate(0) scale(1);opacity:1}
.icon-btn.glow{animation:glow .9s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--glow),0 0 12px 2px var(--glow)}100%{box-shadow:0 0 0 34px transparent,0 0 40px 22px transparent}}

/* app page */
.back{display:inline-flex;align-items:center;gap:6px;margin-top:24px;font-size:14px;font-weight:500;color:var(--muted)}
.back:hover{color:var(--red)}
.ahead{display:flex;gap:24px;align-items:center;padding:24px 0 28px}
.aicon{position:relative;overflow:hidden;width:112px;height:112px;border-radius:26px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:44px;background:linear-gradient(145deg,var(--red),#7d0c17);box-shadow:var(--shadow)}
.aicon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ainfo{flex:1;min-width:0}
.ainfo h1{margin:0;font-size:clamp(26px,5vw,38px);line-height:1.1;letter-spacing:-.03em;font-weight:800}
.beta{display:inline-block;vertical-align:middle;margin-left:10px;font:700 12px Inter,sans-serif;letter-spacing:.02em;color:var(--red-dark);background:color-mix(in srgb,var(--red) 12%,transparent);border:1px solid color-mix(in srgb,var(--red) 32%,transparent);padding:1px 9px;border-radius:99px}
.sub{margin:6px 0 0;color:var(--muted);font-size:15px}
.dev{margin:2px 0 0;color:var(--red-dark);font-size:14px;font-weight:600}
.get{display:inline-block;margin-top:16px;font:700 15px Inter,sans-serif;color:#fff;background:var(--red);padding:10px 34px;border-radius:99px;transition:background .15s,transform .15s}
.get:hover{background:var(--red-dark)}
.get:active{transform:scale(.97)}
.stats{display:flex;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.stat{flex:1;min-width:0;padding:14px 8px;text-align:center;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat small{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk{margin-top:36px;padding-top:28px;border-top:1px solid var(--line)}
.blk h2{font-size:22px;letter-spacing:-.02em;line-height:1.2;margin:0 0 14px}
.blk-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px}
.blk-head h2{margin:0}
.blk-head span{font-size:13px;color:var(--muted)}
.shots{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -24px;padding:0 24px}
.shots::-webkit-scrollbar{display:none}
.shots img{height:380px;width:auto;flex:none;scroll-snap-align:start;border-radius:20px;border:1px solid var(--line);background:var(--tint)}
.txt{margin:0;color:var(--muted);font-size:15px;white-space:pre-line}
.clamp .txt{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.more{margin-top:8px;font:600 14px Inter,sans-serif;color:var(--red-dark);background:none;border:0;padding:0;cursor:pointer}
.vlist{display:grid;gap:12px}
.vrow{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.vrow h3{margin:0;font-size:15px}
.vrow .meta{font-size:13px;color:var(--muted)}
.vrow .txt{font-size:13px;margin-top:6px}
.vget{flex:none;font:700 13px Inter,sans-serif;color:var(--red-dark);background:var(--red-soft);padding:7px 18px;border-radius:99px;transition:background .15s,color .15s}
.vget:hover{background:var(--red);color:#fff}
.state{padding:96px 0;text-align:center;color:var(--muted)}
.state h1{color:var(--text);margin:0 0 8px;font-size:28px}
.state a{color:var(--red-dark);font-weight:600}

footer{margin-top:56px;border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:14px}
.foot-in{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.foot-in a:hover{color:var(--red)}
.foot-in .chg{color:var(--red-dark)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:calc(100% - 32px);text-align:center;background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:2000}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:560px){.nav-link{display:none}.ahead{gap:16px}.aicon{width:88px;height:88px;border-radius:21px;font-size:36px}.shots img{height:320px}.stat b{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
const SOURCE_URL = "https://rep.kerneldev.qzz.io/source.json";
const LOGOS = { altstore:"assets/logos/AltStore-logo.png", sidestore:"assets/logos/sidestore-logo.png", feather:"assets/logos/feather-logo.png", scarlet:"assets/logos/scarlet-logo.png" };
const enc = encodeURIComponent;
const CLIENTS = {
  altstore:  { name:"AltStore",  add:u => "altstore://source?url=" + enc(u),   get:(u,ipa) => "altstore://install?url=" + enc(ipa) },
  sidestore: { name:"SideStore", add:u => "sidestore://source?url=" + enc(u),  get:(u,ipa) => "sidestore://install?url=" + enc(ipa) },
  feather:   { name:"Feather",   add:u => "feather://source/" + u,            get:null },
  scarlet:   { name:"Scarlet",   add:u => "scarlet://add-source?url=" + enc(u), get:null },
  direct:    { name:"Direct links / TrollStore", add:null, get:null }
};
const DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 20h14"/></svg>';
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

const TEXT = {
  "App":"Приложение", "Close":"Закрыть", "Choose installer":"Выберите установщик",
  "Select your sideloading client so the buttons open the right app.":"Выберите клиент для установки, чтобы кнопки открывали нужное приложение.",
  "Kernel's Source home":"Главная Kernel's Source", "Apps":"Приложения", "How it works":"Как это работает",
  "View repository on GitHub":"Открыть репозиторий на GitHub", "‹ All apps":"‹ Все приложения",
  "Kernel's Source. Not affiliated with AltStore, SideStore, Feather or Scarlet.":"Kernel's Source. Не связан с AltStore, SideStore, Feather или Scarlet.",
  "Change installer":"Сменить установщик", "GitHub repository":"Репозиторий GitHub",
  "Switch to light theme":"Включить светлую тему", "Switch to dark theme":"Включить тёмную тему",
  "Direct links / TrollStore":"Прямые ссылки / TrollStore", "Version":"Версия", "Size":"Размер", "Updated":"Обновлено",
  "Beta":"Бета", "Get":"Скачать", "Preview":"Скриншоты", "What’s New":"Что нового", "Description":"Описание",
  "more":"ещё", "less":"свернуть", "Version history":"История версий", "Loading…":"Загрузка…",
  "App not found":"Приложение не найдено", "We couldn’t find that app in the source.":"Не удалось найти это приложение в источнике.",
  "Back to all apps":"К списку приложений", "Opening in your browser…":"Открываем в браузере…",
  "Copy the source link and add it manually.":"Скопируйте ссылку на источник и добавьте его вручную.",
  "Nothing opened? Add the source from the main page manually.":"Ничего не открылось? Добавьте источник вручную с главной страницы.",
  "Couldn’t load the source":"Не удалось загрузить источник", "Check your connection and reload the page.":"Проверьте подключение и обновите страницу."
};
const savedLang = store.get("lang");
let lang = ["ru", "en"].includes(savedLang) ? savedLang : (/^ru\b/i.test(navigator.language || "") ? "ru" : "en");
const tr = text => lang === "ru" ? (TEXT[text] || text) : text;
function localized(obj, field, translations){
  return (obj[translations] && (obj[translations][lang] || obj[translations].en)) || obj[field] || "";
}
function translateStatic(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-en]").forEach(el => { el.textContent = tr(el.dataset.en); });
  document.querySelectorAll("[data-en-aria]").forEach(el => { el.setAttribute("aria-label", tr(el.dataset.enAria)); });
  $("langBtn").textContent = lang === "ru" ? "EN" : "RU";
  $("langBtn").setAttribute("aria-label", lang === "ru" ? "Switch to English" : "Переключить на русский");
}
function toggleLang(){
  lang = lang === "ru" ? "en" : "ru"; store.set("lang", lang);
  translateStatic(); applyTheme(); renderClientList();
  if (APP) render(); else renderState();
}

const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }

/* theme */
const mq = window.matchMedia("(prefers-color-scheme: dark)");
function currentTheme(){ return store.get("theme") || (mq.matches ? "dark" : "light"); }
function applyTheme(){
  const t = currentTheme();
  document.documentElement.setAttribute("data-theme", t);
  $("themeBtn").setAttribute("aria-label", tr(t === "dark" ? "Switch to light theme" : "Switch to dark theme"));
}
function toggleTheme(){
  const next = currentTheme() === "dark" ? "light" : "dark";
  const btn = $("themeBtn"), r = btn.getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const swap = () => { store.set("theme", next); applyTheme(); };
  btn.style.setProperty("--glow", next === "light" ? "#ffc933" : "#8b9bff");
  btn.classList.remove("glow"); void btn.offsetWidth; btn.classList.add("glow");
  if (!document.startViewTransition || matchMedia("(prefers-reduced-motion: reduce)").matches) { swap(); return; }
  const t = document.startViewTransition(swap);
  t.ready.then(() => document.documentElement.animate(
    { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
    { duration: 800, easing: "cubic-bezier(.22,.7,.2,1)", pseudoElement: "::view-transition-new(root)" }
  )).catch(() => {});
}
if (mq.addEventListener) mq.addEventListener("change", () => { if (!store.get("theme")) applyTheme(); });

/* installer choice */
let preferredClient = store.get("preferred_sideload_client");
if (!CLIENTS[preferredClient]) preferredClient = null;
function renderClientList(){
  $("clientList").innerHTML = Object.keys(CLIENTS).map(k => {
    const icon = LOGOS[k] ? `${esc(CLIENTS[k].name[0])}<img src="${LOGOS[k]}" alt="" onerror="this.remove()">` : DL;
    return `<button type="button" class="client-opt-btn${k === preferredClient ? " sel" : ""}" onclick="setClient('${k}')"><span class="ci">${icon}</span><span class="t">${esc(tr(CLIENTS[k].name))}</span></button>`;
  }).join("");
}
function openModal(){ renderClientList(); $("onboardingModal").classList.remove("hidden"); document.body.classList.add("lock"); }
function closeModal(){ $("onboardingModal").classList.add("hidden"); document.body.classList.remove("lock"); }
function setClient(c){ store.set("preferred_sideload_client", c); preferredClient = c; closeModal(); if (APP) render(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
$("onboardingModal").addEventListener("click", e => { if (e.target === e.currentTarget) closeModal(); });
function addLink(){
  const c = CLIENTS[preferredClient];
  return (c && c.add ? c.add : CLIENTS.altstore.add)(SOURCE_URL);
}
function getLink(ipa){
  if (preferredClient === "direct") return ipa;
  const c = CLIENTS[preferredClient];
  return c && c.get ? c.get(SOURCE_URL, ipa) : addLink();
}

/* helpers */
const fmtDate = x => { const d = new Date(x); return isNaN(d) ? "" : d.toLocaleDateString(lang, { month:"short", day:"numeric", year:"numeric" }); };
const fmtSize = n => n ? new Intl.NumberFormat(lang, {minimumFractionDigits:1, maximumFractionDigits:1}).format(n / 1048576) + (lang === "ru" ? " МБ" : " MB") : "";

/* page */
let APP = null;
let pageState = "loading";
function renderState(){
  const title = pageState === "missing" ? "App not found" : pageState === "error" ? "Couldn’t load the source" : "App";
  document.title = tr(title) + " — Kernel's Source";
  $("app").innerHTML = pageState === "loading" ? '<div class="state">' + esc(tr("Loading…")) + '</div>' :
    '<div class="state"><h1>' + esc(tr(title)) + '</h1><p>' + esc(tr(pageState === "missing" ? "We couldn’t find that app in the source." : "Check your connection and reload the page.")) +
    ' <a href="index.html#apps">' + esc(tr("Back to all apps")) + '</a></p></div>';
}
function render(){
  const a = APP, v = a.versions[0];
  const accent = a.bundleIdentifier === "org.ayugram.app" ? "#6385dc" : a.bundleIdentifier === "me.keet.HDRezka" ? "#ef702e" : "#e11d2e";
  document.getElementById("main").style.setProperty("--app-accent", accent);
  const localIcon = ["org.ayugram.app", "me.keet.HDRezka"].includes(a.bundleIdentifier) ? "assets/apps/" + a.bundleIdentifier + ".png" : a.iconURL;
  document.title = a.name + " \u2014 Kernel's Source";
  const shots = (a.screenshotURLs || a.screenshots || []).map(x => typeof x === "string" ? x : (x && x.imageURL)).filter(Boolean).map(shot => {
    const prefix = "https://github.com/kkerneldev/repkernel/blob/main/screenshots/";
    return shot.startsWith(prefix) ? "screenshots/" + shot.slice(prefix.length).split("?")[0] : shot;
  });
  const date = fmtDate(v.date || v.versionDate), size = fmtSize(v.size);
  const stats = [["Version", v.version], ["Size", size], ["Updated", date], ["iOS", v.minOSVersion ? v.minOSVersion + "+" : ""]].filter(s => s[1]);
  const notes = localized(v, "localizedDescription", "localizedDescriptions").trim();
  const subtitle = localized(a, "subtitle", "localizedSubtitles");
  const desc = (localized(a, "localizedDescription", "localizedDescriptions") || subtitle).trim();
  const older = a.versions.slice(1);
  $("app").innerHTML = `
    <div class="ahead">
      <div class="aicon" aria-hidden="true">${esc(a.name[0])}${localIcon ? `<img src="${esc(localIcon)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}</div>
      <div class="ainfo">
        <h1>${esc(a.name)}${a.beta ? '<span class="beta">' + esc(tr("Beta")) + '</span>' : ""}</h1>
        ${subtitle ? `<p class="sub">${esc(subtitle)}</p>` : ""}
        ${a.developerName ? `<p class="dev">${esc(a.developerName)}</p>` : ""}
        <a class="get" href="${esc(getLink(v.downloadURL))}" aria-label="${esc(tr("Get") + " " + a.name)}">${esc(tr("Get"))}</a>
      </div>
    </div>
    <div class="stats">${stats.map(s => `<div class="stat"><small>${esc(tr(s[0]))}</small><b>${esc(s[1])}</b></div>`).join("")}</div>
    ${shots.length ? `<div class="blk"><h2>${esc(tr("Preview"))}</h2><div class="shots">${shots.map(u => `<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`).join("")}</div></div>` : ""}
    ${notes ? `<div class="blk"><div class="blk-head"><h2>${esc(tr("What’s New"))}</h2><span>${esc(tr("Version"))} ${esc(v.version)}${date ? " \u00b7 " + esc(date) : ""}</span></div><p class="txt">${esc(notes)}</p></div>` : ""}
    ${desc ? `<div class="blk" id="descBlk"><h2>${esc(tr("Description"))}</h2><div class="clamp" id="descBox"><p class="txt">${esc(desc)}</p></div><button class="more hidden" id="moreBtn" type="button">${esc(tr("more"))}</button></div>` : ""}
    ${older.length ? `<div class="blk"><h2>${esc(tr("Version history"))}</h2><div class="vlist">${older.map(o => `
      <div class="vrow"><div><h3>${esc(o.version)}</h3><div class="meta">${esc([fmtDate(o.date || o.versionDate), fmtSize(o.size)].filter(Boolean).join(" \u00b7 "))}</div>${localized(o, "localizedDescription", "localizedDescriptions") ? `<p class="txt">${esc(localized(o, "localizedDescription", "localizedDescriptions").trim())}</p>` : ""}</div>
      <a class="vget" href="${esc(getLink(o.downloadURL))}" aria-label="${esc(tr("Get") + " " + tr("Version") + " " + o.version)}">${esc(tr("Get"))}</a></div>`).join("")}</div></div>` : ""}`;
  const box = $("descBox"), btn = $("moreBtn");
  if (box && btn && box.scrollHeight > box.clientHeight + 2) {
    btn.classList.remove("hidden");
    btn.onclick = () => { const open = box.classList.toggle("clamp") === false; btn.textContent = tr(open ? "less" : "more"); };
  }
}

/* toast + custom-scheme handling */
let tt;
function showToast(msg){ const t = $("toast"); t.textContent = tr(msg); t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2600); }
document.addEventListener("click", e => {
  const a = e.target.closest("a[href]");
  if (!a) return;
  const href = a.getAttribute("href");
  const isCustom = /^[a-z][a-z0-9+.-]*:/i.test(href) && !/^https?:/i.test(href);
  if (tg && typeof tg.openLink === "function" && (isCustom || /\.ipa($|\?)/i.test(href))) {
    e.preventDefault();
    const target = /^https?:/.test(href) ? href : new URL("open.html?u=" + encodeURIComponent(href), location.href).href;
    try { tg.openLink(target); showToast("Opening in your browser\u2026"); } catch (_) { showToast("Copy the source link and add it manually."); }
    return;
  }
  if (!isCustom) return;
  let left = false;
  const onHide = () => { left = true; };
  document.addEventListener("visibilitychange", onHide, { once:true });
  window.addEventListener("blur", onHide, { once:true });
  setTimeout(() => { if (!left) showToast("Nothing opened? Add the source from the main page manually."); }, 1800);
});

/* init */
$("yr").textContent = new Date().getFullYear();
translateStatic();
applyTheme();
renderState();
const q = new URLSearchParams(location.search).get("id");
function loadApp(){
return window.fetchCatalogue("source.json", { cache:"no-cache" }).then(r => r.ok ? r.json() : Promise.reject()).then(j => {
  const app = (j.apps || []).find(a => a.bundleIdentifier === q || a.name === q);
  if (app && app.versions && app.versions[0]) { APP = app; render(); } else { pageState = "missing"; renderState(); }
}).catch(() => { if (!APP) { pageState = "error"; renderState(); } });
}
loadApp();
window.addEventListener("catalogue-reconnect", loadApp);
</script>
</body>
