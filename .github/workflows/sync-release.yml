name: Sync releases

# Updates source.json and news.json when a new IPA is published, and draws the news card.
on:
  release:
    types: [published, edited]
  schedule:
    - cron: "0 */6 * * *"      # a fixed "pre-release" tag doesn't always fire release events, so check regularly too
  workflow_dispatch:
    inputs:
      force_news:
        description: "Create news for the CURRENT versions too (run once to fill the news)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEWS_LANG: ru               # label on the card: ru or en
          FORCE_NEWS: ${{ github.event.inputs.force_news }}
        run: python3 scripts/sync_release.py

      - name: Validate updated source
        run: python scripts/validate_source.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source.json assets/news
          [ -f news.json ] && git add news.json || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Sync release data"
            git push
          fi
