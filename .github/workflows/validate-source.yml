name: Validate source

on:
  push:
    paths:
      - source.json
      - scripts/validate_source.py
      - .github/workflows/validate-source.yml
  pull_request:
    paths:
      - source.json
      - scripts/validate_source.py
      - .github/workflows/validate-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_source.py
